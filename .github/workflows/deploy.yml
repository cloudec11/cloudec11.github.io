# One-time setup: repo Settings > Pages > Build and deployment > Source = "GitHub Actions".

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a newer push cancels an older run still waiting
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- CI ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build the exact folder that will ship: everything except drafts and repo files
      - name: Assemble site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git*' --exclude 'drafts/' --exclude '.impeccable/' --exclude '.htmlvalidate.json' \
                   --exclude 'README.md' --exclude '_site/' ./ _site/

      # Fails the build if index.html has invalid or inaccessible markup
      - name: Validate HTML
        run: npx --yes html-validate@9 _site/index.html

      # Fails the build on broken links or missing images/scripts
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir "$PWD/_site" --accept '200..=299,403,429,999' --exclude 'dorahacks\.io' '_site/**/*.html'
          fail: true

      # Scores performance, accessibility, SEO and best practices; fails below the budgets
      - name: Lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.github/lighthouserc.json
          uploadArtifacts: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # ---------- CD ----------
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
